name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: pgdiag-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      PG_DIAG_TEST_DSN: postgresql://postgres:pgdiag-ci@localhost:5432/postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync dependencies (Python 3.12)
        run: uv sync --python 3.12 --extra dev

      - name: Run Ruff lint
        run: uv run ruff check .

      - name: Run Mypy type check
        run: uv run mypy src

      - name: Run unit and integration tests
        run: uv run pytest -v
